# Build and publish multi-arch Docker images to GitHub Container Registry
#
# Triggers:
#   - On release publish (creates versioned + latest tags)
#   - On push to main (creates :main tag for testing)
#   - Manual dispatch (for testing)
#
# Images published to: ghcr.io/archetech/cl-hive-node
#
# Usage for end users:
#   docker pull ghcr.io/archetech/cl-hive-node:latest
#   docker pull ghcr.io/archetech/cl-hive-node:v2.2.1

name: Build and Publish Docker

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'modules/**'
      - 'cl-hive.py'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., v2.2.1 or test)'
        required: false
        default: 'dev'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: archetech/cl-hive-node

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version detection

      - name: Set up QEMU (for ARM64 cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For releases: v2.2.1 -> 2.2.1, latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            # For main branch pushes
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            # For manual dispatch
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=cl-hive-node
            org.opencontainers.image.description=Production Lightning node with cl-hive coordination and cl-revenue-ops
            org.opencontainers.image.vendor=Lightning Goats
            org.opencontainers.image.documentation=https://github.com/archetech/cl-hive/blob/main/docker/README.md
            org.opencontainers.image.source=https://github.com/archetech/cl-hive

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CLN_VERSION=v25.12.1
            SLING_VERSION=v4.1.3
            CLN_REST_VERSION=v0.10.7
            CL_REVENUE_OPS_VERSION=main

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false
        if: github.event_name == 'release'

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v1
        with:
          files: sbom.spdx.json
        if: github.event_name == 'release'

      - name: Create summary
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms" >> $GITHUB_STEP_SUMMARY
          echo "- linux/amd64 (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- linux/arm64 (aarch64 / Apple Silicon / Raspberry Pi 4+)" >> $GITHUB_STEP_SUMMARY

  # Verify the published image works
  verify:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    env:
      VERIFY_IMAGE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Pull and verify image
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERIFY_IMAGE_TAG#v}"
          docker pull "$IMAGE_REF"

          # Verify binaries and bundled files without invoking the runtime entrypoint.
          docker run --rm --entrypoint lightningd "$IMAGE_REF" --version

          # Verify plugins are present
          docker run --rm --entrypoint test "$IMAGE_REF" -f /opt/cl-hive/cl-hive.py
          docker run --rm --entrypoint test "$IMAGE_REF" -f /opt/cl-revenue-ops/cl-revenue-ops.py
          docker run --rm --entrypoint test "$IMAGE_REF" -f /usr/local/bin/sling

          echo "Image verification passed"

      - name: Test basic startup (no Bitcoin)
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERIFY_IMAGE_TAG#v}"
          RPC_PORT=18443

          python3 - <<'PY' &
          import base64
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          EXPECTED_AUTH = "Basic " + base64.b64encode(b"test:test").decode()

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  if self.headers.get("Authorization") != EXPECTED_AUTH:
                      self.send_response(401)
                      self.end_headers()
                      return

                  body = json.dumps({
                      "result": {"chain": "regtest", "blocks": 1},
                      "error": None,
                      "id": None,
                  }).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, format, *args):
                  pass

          HTTPServer(("0.0.0.0", 18443), Handler).serve_forever()
          PY
          RPC_PID=$!
          trap 'kill $RPC_PID' EXIT

          # Start container briefly to check entrypoint doesn't crash
          timeout 30 docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e BITCOIN_RPCHOST=host.docker.internal \
            -e BITCOIN_RPCPORT=$RPC_PORT \
            -e BITCOIN_RPCUSER=test \
            -e BITCOIN_RPCPASSWORD=test \
            -e NETWORK=regtest \
            "$IMAGE_REF" \
            bash -c "echo 'Container starts OK'" || true
